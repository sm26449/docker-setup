name: esphome
description: "ESP8266/ESP32 firmware builder"

# No published port (2026-10-10): the dashboard has no login. In pv-stack it is
# the compiler multi-bus-gateway-esphome drives over pv-stack-network; people
# edit through ESPHome Device Builder behind MBG's login (see
# templates/multi-bus-gateway-esphome/INTEGRATION.md).

compose: |
  ${SERVICE_NAME}:
    image: ghcr.io/esphome/esphome:latest
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_ROOT}/${SERVICE_NAME}/config:/config
