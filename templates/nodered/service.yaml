name: nodered
description: "Flow-based programming for IoT"

dependencies:
  - name: mosquitto
    variables:
      NODERED_MQTT_HOST: "${HOST}"
      NODERED_MQTT_PORT: "${PORT}"

variables:
  NODERED_PORT:
    default: "1880"
    description: "Node-RED web port"
  NODE_RED_CREDENTIAL_SECRET:
    default: ""
    description: "Secret for encrypting credentials"
    generate: random
  NODERED_ADMIN_USER:
    default: "admin"
    description: "Editor / admin API login (adminAuth)"
  NODERED_ADMIN_PASSWORD:
    default: ""
    description: "Editor / admin API password (plain, for clients and scripts)"
    generate: random
  NODERED_ADMIN_PASSWORD_HASH:
    default: ""
    description: "bcrypt hash of NODERED_ADMIN_PASSWORD (single-quote it in .env: it contains $)"
  NODERED_INFLUXDB_TOKEN:
    default: ""
    description: "Read-only InfluxDB token for the derived nodes (${NODERED_INFLUXDB_TOKEN} in the flows)"
  TUYA_AC_DEVICES:
    default: "[]"
    description: "JSON list of Tuya AC devices for ac-tuya-in/out (${TUYA_AC_DEVICES} in the flows)"

config_files:
  - path: "data/settings.js"
    content: |
      /**
       * Node-RED Settings
       * https://nodered.org/docs/user-guide/runtime/settings-file
       */
      module.exports = {
          flowFile: 'flows.json',
          flowFilePretty: true,

          // Persist context to disk (a restart never wipes runtime state).
          contextStorage: {
              default: { module: 'localfilesystem', config: { flushInterval: 15 } },
              memory:  { module: 'memory' },
          },

          // Credential encryption
          credentialSecret: process.env.NODE_RED_CREDENTIAL_SECRET || false,

          // Editor / admin API login. Without it anyone on the LAN can read
          // the flows and deploy flows that command the battery (S12).
          adminAuth: process.env.NODERED_ADMIN_PASSWORD_HASH ? {
              type: "credentials",
              users: [{
                  username: process.env.NODERED_ADMIN_USER || "admin",
                  password: process.env.NODERED_ADMIN_PASSWORD_HASH,
                  permissions: "*"
              }]
          } : undefined,

          // User directory
          userDir: '/data',

          // Logging
          logging: {
              console: {
                  level: "info",
                  metrics: false,
                  audit: false
              }
          },

          // Editor settings
          editorTheme: {
              projects: {
                  enabled: false
              },
              palette: {
                  editable: true
              }
          },

          // Function global context
          functionGlobalContext: {
          },

          // Export global context
          exportGlobalContextKeys: false,

          // Debug max length
          debugMaxLength: 1000,

          // MQTT reconnect time
          mqttReconnectTime: 15000,

          // Serial reconnect time
          serialReconnectTime: 15000
      }

compose: |
  ${SERVICE_NAME}:
    # Pinned to a specific minor — audit B-O5 (pv-stack-ui Phase-2).
    # Node-RED's `:latest` tracks every release including breaking
    # ones (the 3→4 jump dropped Node 14 support). Bump intentionally.
    image: nodered/node-red:5.0.0
    container_name: ${SERVICE_NAME}
    restart: always
    # Primary controller — shield from the OOM killer (2026-07-15 cascade).
    oom_score_adj: -800
    user: "${PUID}:${PGID}"
    ports:
      - "${NODERED_PORT:-1880}:1880"
    environment:
      - TZ=${TZ}
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET}
      # Secrets live in .env, never in the flows (S12 2026-10-13).
      - NODERED_ADMIN_USER=${NODERED_ADMIN_USER}
      - NODERED_ADMIN_PASSWORD_HASH=${NODERED_ADMIN_PASSWORD_HASH}
      - NODERED_INFLUXDB_TOKEN=${NODERED_INFLUXDB_TOKEN}
      - TUYA_AC_DEVICES=${TUYA_AC_DEVICES}
    volumes:
      - ${DOCKER_ROOT}/${SERVICE_NAME}/data:/data
