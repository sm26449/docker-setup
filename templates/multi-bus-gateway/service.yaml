name: multi-bus-gateway
description: "Multi-Bus Gateway — multi-protocol acquisition (Modbus/HTTP/MQTT) to MQTT/InfluxDB/virtual meters, with Web UI"

# Modbus/MQTT/InfluxDB connection settings live in the UI-editable
# config.yaml (bind-mounted volume), NOT in env — the old JANITZA_*
# variable block is gone (2026-08-14 rename/cleanup). Compose consumes
# only the variables below.

dependencies:
  - name: mosquitto
  - name: influxdb

variables:
  MBG_UI_PORT:
    default: "8080"
    description: "Web UI port"
    prompt: true
  MBG_API_KEY:
    default: ""
    description: "Optional API key for state-changing requests (empty = open, trusted-LAN + app auth)"
  VMETER_PORT_START:
    default: "1502"
    description: "Virtual meter port range start (published once; UI validates instance ports within it)"
  VMETER_PORT_END:
    default: "1512"
    description: "Virtual meter port range end (widen + one recreate to allow more meters)"

volumes:
  - "${DOCKER_ROOT}/pv-stack/multi-bus-gateway/config:/app/config"
