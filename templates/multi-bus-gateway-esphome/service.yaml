name: mbg-esphome
description: "multi-bus-gateway-esphome — flash ESPs from the browser and list the nodes, at <mbus host>/nodes behind MBG's login"

# The app (8090) is reached ONLY through Traefik (templates/traefik/config/
# dynamic/mbus.yml: router mbus-nodes, forwardAuth → multi-bus-gateway
# /api/auth/forward); it trusts the role headers Traefik sets, so 8090 is never
# published. Only 8091 is: the node update downloads (one route, tokens). The code is
# an rsync copy of /home/stefanm/multi-bus-gateway-esphome (like MBG's).
# The data dir must be owned by uid 10001 (the image's user).

dependencies:
  - name: mosquitto
  - name: esphome
  - name: multi-bus-gateway

variables:
  MBG_NODE_MQTT_HOST:
    default: "192.168.88.239"
    description: "The broker as the ESP nodes reach it (LAN address, baked into the basic image)"
    prompt: true

  MBG_NODE_MQTT_USERNAME:
    default: "mbg-node"
    description: "Broker account baked into node firmware; the broker ACL must confine it to mbg/nodes/#"
  MBG_NODE_MQTT_PASSWORD:
    default: ""
    description: "Its password (random; also add it to the broker's pwfile)"

volumes:
  - "${DOCKER_ROOT}/pv-stack/mbg-esphome/data:/data"
