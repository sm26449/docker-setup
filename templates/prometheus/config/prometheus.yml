# Prometheus — PV-Stack. Scrapes the Multi-Bus Gateway + pv-stack-ui metrics.
global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: multibus-gateway
    static_configs:
      - targets: ['multi-bus-gateway:8080']
        labels:
          stack: pv-stack

  # pv-stack-ui MQTT topic-cache age/size gauges (roadmap #10). Note: 4
  # gunicorn workers each answer with their own in-memory caches; scraping
  # any one is representative since all subscribe the same retained topics.
  - job_name: pv-stack-ui
    metrics_path: /api/prometheus
    static_configs:
      - targets: ['pv-stack-ui:5000']
        labels:
          stack: pv-stack

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
